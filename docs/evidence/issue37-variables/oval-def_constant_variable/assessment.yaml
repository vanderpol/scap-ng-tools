assessment:
  id: oval-org-mitre-oval-test-def-92-assessment
  version: 1
  assessment_title: Evaluate to true if the oval-def:constant_variable construct is properly supported
  mode: automated
  class: miscellaneous
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  variables:
    oval-org-mitre-oval-test-var-641-variable:
      kind: constant
      datatype: integer
      expression:
        literal:
        - 9
    oval-org-mitre-oval-test-var-831-variable:
      kind: constant
      datatype: integer
      expression:
        literal:
        - 15
        - 18
        - 20
        - 24
        - 30
        - 36
        - 40
        - 48
  tests:
    oval-org-mitre-oval-test-tst-695-test:
      test_title: Test that the constant_variable construct is supported with a single value.
      capability: variable.value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        fields:
          value: {equals: 9}
        field_requirement: {values_found: one_or_more, values_matching: every}
      reported_elements: all
      variable: oval-org-mitre-oval-test-var-641-variable
    oval-org-mitre-oval-test-tst-324-test:
      test_title: Test that the constant_variable construct is supported with multiple values.
      capability: variable.value
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        fields:
          value:
            greater_than: 7
        field_requirement: {values_found: one_or_more, values_matching: every}
      reported_elements: all
      variable: oval-org-mitre-oval-test-var-831-variable
  evaluate:
    and:
    - test: oval-org-mitre-oval-test-tst-695-test
    - test: oval-org-mitre-oval-test-tst-324-test
