[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scap-ng-tools"
version = "0.0.0"
description = "Development-stage tools shared by SCAP-NG converters and editors"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

