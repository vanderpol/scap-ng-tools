name: Authoring foundation safety checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-contained-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify the exact reviewed head
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared standalone authoring dependencies
        run: python -m pip install -e .
      - name: Validate standalone authoring utilities and import provenance
        run: PYTHONPATH=src python -m unittest discover -s tests -v

