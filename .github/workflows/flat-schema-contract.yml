name: Pinned flat 0.4 schema contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flat-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools under review
        uses: actions/checkout@v4
      - name: Checkout exact frozen schema snapshot (temporary staging name)
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng-staging
          ref: ed4a9dce01af6849bf4be146c7678ef7804051e4
          path: spec-snapshot
          persist-credentials: false
      - name: Checkout immutable Q3 2026 NIWC signed benchmark archive
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: signed-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Archive/2026_Q3/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            Archive/2026_Q3/U_Active_Directory_Domain_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
            Archive/2026_Q3/U_Amazon_Linux_2023_V1R2_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            Archive/2026_Q3/U_MS_Windows_Defender_Firewall_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV14-signed.zip
          filter: blob:none
          persist-credentials: false
      - name: Checkout pinned research generator and independent oracle (CI only)
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: d12a644f4607cdc9c9ada50e3a96d4fd0060c6d9
          path: legacy-oracle
          sparse-checkout: |
            tools
            schema/v0.4.0
            third_party/scap-1.4-schemas/oval_5.12.3
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped converter dependencies
        run: python -m pip install -e .
      - name: Rebuild and byte-audit the portable 0.4 semantic contract pack
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_v04_semantic_pack.py \
            --research-root "${{ github.workspace }}/legacy-oracle" \
            --schema-root "${{ github.workspace }}/spec-snapshot" \
            --output "${{ runner.temp }}/semantic-contract-pack.json"
          cmp "${{ runner.temp }}/semantic-contract-pack.json" \
            src/scap_ng_tools/converter/_v04_semantic/contracts-0.4.0.json
      - name: Verify copied converter, pinned conversion and flat-schema adapter
        env:
          PYTHONPATH: src
          SCAP_NG_SCHEMA_ROOT: ${{ github.workspace }}/spec-snapshot
          SCAP_NG_SOURCE_FIXTURE: ${{ github.workspace }}/signed-source/Archive/2026_Q3/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          SCAP_NG_ADDITIONAL_FIXTURES_ROOT: ${{ github.workspace }}/signed-source/Archive/2026_Q3
          SCAP_NG_RESEARCH_ROOT: ${{ github.workspace }}/legacy-oracle
        run: python -m unittest discover -s tests -v
