name: Pinned flat 0.4 schema contracts

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flat-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools under review
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify the exact reviewed head
        env:
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEW_HEAD"
      - name: Checkout exact owner-amended pre-release 0.4 schema snapshot
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: f7e5e845d21e3a38ec5dc5ec04228b763acd9c5b
          path: spec-snapshot
          persist-credentials: false
      - name: Checkout the exact admitted production converter distribution
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng-tools
          ref: f97ff187460f52da78bd16f5009f7d182664812b
          path: approved-producer
          persist-credentials: false
      - name: Checkout immutable Q3 2026 NIWC signed benchmark archive
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: signed-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Archive/2026_Q3/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            Archive/2026_Q3/U_Active_Directory_Domain_V3R6_STIG_SCAP_1-4_Benchmark-enhancedV2-signed.zip
            Archive/2026_Q3/U_Amazon_Linux_2023_V1R2_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
            Archive/2026_Q3/U_MS_Windows_Defender_Firewall_V2R3_STIG_SCAP_1-4_Benchmark-enhancedV14-signed.zip
          filter: blob:none
          persist-credentials: false
      - name: Checkout official OVAL 5.12.3 generator inputs (CI only)
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/OVAL
          ref: 2f140ee5c5dd1ed9606fcd5afc301f6baeb48706
          path: official-oval
          sparse-checkout: |
            oval-schemas
          filter: blob:none
          persist-credentials: false
      - name: Checkout pinned original standalone OVAL Variable sources
        uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: self-assertion
          sparse-checkout: SCAP_1.4/OVAL_Test_Content/agnostic
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped converter dependencies
        run: python -m pip install -e .
      - name: Rebuild and byte-audit the portable 0.4 semantic contract pack
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_v04_semantic_pack.py \
            --oval-root "${{ github.workspace }}/official-oval" \
            --schema-root "${{ github.workspace }}/spec-snapshot" \
            --output "${{ runner.temp }}/semantic-contract-pack.json"
          cmp "${{ runner.temp }}/semantic-contract-pack.json" \
            src/scap_ng_tools/converter/_v04_semantic/contracts-0.4.0.json
      - name: Verify copied converter, pinned conversion and flat-schema adapter
        env:
          PYTHONPATH: src
          SCAP_NG_SCHEMA_ROOT: ${{ github.workspace }}/spec-snapshot
          SCAP_NG_OVAL_ROOT: ${{ github.workspace }}/official-oval
          SCAP_NG_SOURCE_FIXTURE: ${{ github.workspace }}/signed-source/Archive/2026_Q3/U_MS_Windows_Server_2025_V1R1_STIG_SCAP_1-4_Benchmark-enhancedV1-signed.zip
          SCAP_NG_ADDITIONAL_FIXTURES_ROOT: ${{ github.workspace }}/signed-source/Archive/2026_Q3
          SCAP_NG_OVAL_TEST_CONTENT: ${{ github.workspace }}/self-assertion
          SCAP_NG_APPROVED_CONVERTER_ROOT: ${{ github.workspace }}/approved-producer
          SCAP_NG_PUBLICATION_REQUIRED: '1'
        run: python -m unittest discover -s tests -v
      - name: Prepare actual current converter output for publication dry-run
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          request={'mode':'oval-definition','source_commit':'e3538595c5083b9c34d937a81d319234df9bbfaa',
                   'source_path':'SCAP_1.4/OVAL_Test_Content/agnostic/oval-def_constant_variable.xml',
                   'source_sha256':'57113e1d5991bec0c7cee30d2789ecf9bff5223d2f2ab78900098c187a716e91',
                   'selection':'oval:org.mitre.oval.test:def:92'}
          (Path(os.environ['RUNNER_TEMP'])/'publication-request.json').write_text(json.dumps(request))
          PY
          python -m scap_ng_tools.publication prepare \
            --producer-root approved-producer --schema-root spec-snapshot --source-root self-assertion \
            --request "$RUNNER_TEMP/publication-request.json" --output "$RUNNER_TEMP/current-candidate"
      - name: Execute the actual shared publication action without uploading
        uses: ./.github/actions/current-publication
        with:
          candidate: ${{ runner.temp }}/current-candidate
          producer-root: approved-producer
          schema-root: spec-snapshot
          source-root: self-assertion
          dry-run: 'true'
      - name: Reject publication paths outside the shared gate
        run: |
          python scripts/audit_publication_paths.py --root . --repository vanderpol/scap-ng-tools \
            --trusted-gate-commit 053eeeb3b33e3ee5f683604fd66ae8c833450cd0 --check
