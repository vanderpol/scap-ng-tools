name: Pinned flat 0.4 schema contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flat-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tools under review
        uses: actions/checkout@v4
      - name: Checkout exact frozen schema snapshot (temporary staging name)
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng-staging
          ref: ed4a9dce01af6849bf4be146c7678ef7804051e4
          path: spec-snapshot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native helpers and frozen flat-schema adapter
        env:
          PYTHONPATH: src
          SCAP_NG_SCHEMA_ROOT: ${{ github.workspace }}/spec-snapshot
        run: python -m unittest discover -s tests -v
