name: Issue 59 full-65 source Rule admission (read-only)

on:
  push:
    branches:
      - main
      - codex/issue59-single-v041-semantic-pack
    paths:
      - '.github/workflows/issue59-full65-rebuild.yml'
      - 'scripts/rebuild_issue59_full65.py'
      - 'tests/test_issue59_rebuild_full65.py'
      - 'src/scap_ng_tools/converter/native041_function_lowering.py'
      - 'src/scap_ng_tools/converter/native041_input_relation.py'
      - 'tests/test_issue59_input_relation.py'
      - 'src/scap_ng_tools/converter/direct04.py'
      - 'src/scap_ng_tools/converter/oval_platform.py'
      - 'src/scap_ng_tools/converter/_v04_runtime/v04_direct_converter.py'
      - 'src/scap_ng_tools/converter/_v04_semantic/v04_comparison_types.py'
      - 'src/scap_ng_tools/converter/_v04_semantic/v04_variable_expressions.py'
      - 'tests/test_issue59_remaining_collected_audit.py'

  pull_request:
    branches:
      - codex/issue59-single-v041-semantic-pack
      - fix/issue59-native-text-projection-20261113
      - fix/issue59-source-unique-lexical-projection-20261113
      - test/issue59-atomic-lowering-boundaries-20261114
    paths:
      - '.github/workflows/issue59-full65-rebuild.yml'
      - 'src/scap_ng_tools/converter/native041_function_lowering.py'
      - 'tests/test_issue59_native_text_projection.py'
      - 'tests/test_issue59_unique_lexical_projection.py'
      - 'scripts/triage_issue59_regressions.py'
      - 'scripts/build_issue59_datatype_recovery.py'
      - 'scripts/build_issue59_textfilecontent_patterns.py'
      - 'scripts/build_issue59_remaining_collected_audit.py'
      - 'docs/evidence/issue59/full65-pre-recovery-source-rule-rebuild.json'
      - 'docs/evidence/issue59/textfilecontent-subexpression-patterns.json'
      - 'tests/test_issue59_textfilecontent_patterns.py'
      - 'docs/evidence/issue59/full65-pre-recovery-source-rule-rebuild.json'
      - 'tests/test_issue59_regression_triage.py'
      - 'tests/test_issue59_atomic_lowering_boundaries.py'
      - 'src/scap_ng_tools/converter/_v04_runtime/v04_direct_converter.py'
      - 'src/scap_ng_tools/converter/_v04_semantic/v04_comparison_types.py'
      - 'src/scap_ng_tools/converter/_v04_semantic/v04_variable_expressions.py'
      - 'tests/test_issue59_remaining_collected_audit.py'
      - 'docs/evidence/issue59/OPERATION-DIRECTED-RECOVERY.md'
      - 'docs/evidence/issue59/operation-directed-recovery.json'

permissions:
  contents: read

concurrency:
  group: issue59-full65-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  pinned-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR converter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout exact canonical 0.4.1 schema snapshot
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: aece827964c785be77b088c3c61255a2d07fd9a9
          path: canonical-schema
          persist-credentials: false

      - name: Checkout original 65 source ZIP corpus
        uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: source-library
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install offline converter
        run: python -m pip install -e .

      - name: Test source Rule identity, exclusions and negative checks
        run: python -m unittest discover -s tests -p test_issue59_rebuild_full65.py -v

      - name: Rebuild all original ZIPs against one pinned 0.4.1 schema
        run: >-
          python scripts/rebuild_issue59_full65.py
          --schema-root canonical-schema/schema
          --source-root source-library
          --output generated/issue59-full65-source-rule-rebuild.json

      - name: Qualify fail-closed Rule-ID triage helper
        run: python -m unittest discover -s tests -p test_issue59_regression_triage.py -v

      - name: Qualify operation-directed collected-field representation
        run: python -m unittest discover -s tests -p test_issue59_remaining_collected_audit.py -v

      - name: Generate source-ID regression triage from actual rebuild
        run: >-
          python scripts/triage_issue59_regressions.py
          --input generated/issue59-full65-source-rule-rebuild.json
          --csv generated/issue59-regression-triage.csv
          --summary generated/issue59-regression-triage-summary.json

      - name: Generate source datatype recovery ledger
        run: >-
          python scripts/build_issue59_datatype_recovery.py
          --receipt generated/issue59-full65-source-rule-rebuild.json
          --original-receipt docs/evidence/issue59/full65-pre-recovery-source-rule-rebuild.json
          --source-root source-library
          --schema-root canonical-schema/schema
          --crosswalk docs/evidence/issue59/full65-crosswalk.json
          --output generated/issue59-datatype-recovery.json

      - name: Generate textfilecontent pattern review
        run: >-
          python scripts/build_issue59_textfilecontent_patterns.py
          --ledger generated/issue59-datatype-recovery.json
          --source-root source-library
          --output generated/issue59-textfilecontent-subexpression-patterns.json

      - name: Generate remaining collected-field audit
        run: >-
          python scripts/build_issue59_remaining_collected_audit.py
          --ledger generated/issue59-datatype-recovery.json
          --original-receipt docs/evidence/issue59/full65-pre-recovery-source-rule-rebuild.json
          --source-root source-library
          --output generated/issue59-remaining-23-collected-field-audit.json

      - name: Publish read-only diagnostic receipt (no source ZIPs or generated authoring)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue59-65zip-rule-id-admission-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            generated/issue59-full65-source-rule-rebuild.json
            generated/issue59-regression-triage.csv
            generated/issue59-regression-triage-summary.json
            generated/issue59-datatype-recovery.json
            generated/issue59-textfilecontent-subexpression-patterns.json
            generated/issue59-remaining-23-collected-field-audit.json

      - name: Fail if any previously converted active source Rule regressed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("generated/issue59-full65-source-rule-rebuild.json").read_text())
          print("Active 59 benchmark disposition:", json.dumps(result["candidate"], sort_keys=True))
          print("Formerly converted source Rule IDs newly blocked/manual:",
                result["newly_blocked_from_converted"])
          if not result["nonregression_pass"]:
              raise SystemExit("HOLD: 0.4.1 source Rule-ID admission still regresses")
          print("PASS: no formerly converted active source Rule ID lost")
          PY
