name: Candidate Variable inference converter/schema handshake
on:
  pull_request:
    paths:
      - '.github/workflows/variable-inference-candidate.yml'
      - 'src/scap_ng_tools/converter/**'
      - 'tests/test_variable_inference_candidate.py'
      - 'tests/test_converter_provenance.py'
permissions:
  contents: read
jobs:
  candidate-schema-converter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate converter
        uses: actions/checkout@v4
      - name: Checkout exact canonical candidate
        uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: 928288f110d3335d6d2da51d0285e2d531a639ea
          path: candidate-schema
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scoped dependencies
        run: python3 -m pip install .
      - name: Generate and verify 0.4.1 schema family from immutable 0.4.0 source
        run: |
          python3 candidate-schema/tools/build_schema_v041.py
          python3 candidate-schema/tools/build_schema_v041.py --check
      - name: Check exact canonical candidate and historical regression tests
        env:
          SCAP_NG_CANDIDATE_SCHEMA_ROOT: candidate-schema/schema/v0.4.1
        run: |
          set -euo pipefail
          test "$(git -C candidate-schema rev-parse HEAD)" = 928288f110d3335d6d2da51d0285e2d531a639ea
          python3 -m unittest discover -s tests -p 'test_variable_inference_candidate.py' -v
          python3 -m unittest discover -s tests -p 'test_converter_provenance.py' -v
