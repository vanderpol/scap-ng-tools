name: Issue 59 Windows relation source witnesses (read-only)

on:
  pull_request:
    paths:
      - '.github/workflows/issue59-relation-source-witness.yml'

permissions:
  contents: read

jobs:
  relation-source-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: 44991ed3753944e47c42d76f157b29448b256a34
          path: canonical-schema
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: niwc-atlantic/scap-content-library
          ref: 8c8e5dff860af6b1290ee9273a282db24278f8d5
          path: original-source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e .

      - name: Extract original Rule-specific authoring and schema witnesses
        run: |
          python scripts/qualify_windows_relation_witness.py \
            --source-root original-source \
            --schema-root canonical-schema/schema \
            --output relation-source-witnesses.json

      - name: Retain only bounded source-linked diagnostic JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue59-relation-source-witnesses-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: relation-source-witnesses.json
