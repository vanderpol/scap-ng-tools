name: P0 regenerate entire OVAL Test Content into current 0.4
on:
  push:
    branches: [audit/full-oval-test-content-parity-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OVAL-Community/SCAP-Self-Assertion
          ref: e3538595c5083b9c34d937a81d319234df9bbfaa
          path: external/source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vanderpol/scap-ng
          ref: 919732d4c570b521edf82196a7694dfd8c27fe50
          path: external/schema
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install .
      - name: Run complete pinned original-to-native production conversion
        env:
          SCAP_NG_INCLUDE_EMBEDDED_ARCHIVES: '1'
        run: |
          set -euo pipefail
          test "$(git -C external/source rev-parse HEAD)" = e3538595c5083b9c34d937a81d319234df9bbfaa
          python3 scripts/convert_self_assertion_corpus.py \
            --corpus external/source \
            --schema-root external/schema \
            --source-commit e3538595c5083b9c34d937a81d319234df9bbfaa \
            --output generated/self-assertion-current-candidate
      - name: Print bounded converter rejection root causes
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          d=json.loads(Path("generated/self-assertion-current-candidate/definitions.json").read_text())
          c=Counter((x.get("failure_class"),(x.get("diagnostic") or "")[:300]) for x in d if x.get("conversion_status")!="CONVERTED_UNVERIFIED")
          print("CONVERTER DIAGNOSTIC TOP 12:")
          for (kind,reason),n in c.most_common(12):
            print(n,kind,reason.replace("\\n"," ")[:600])
          failures=[x for x in d if x.get("failure_class")=="converter_failure"]
          if failures:
            print("FIRST CONVERTER FAILURE FULL:",failures[0]["diagnostic"][-2200:])
          print("FIRST CONVERTED:",[x["definition_id"] for x in d if x.get("conversion_status")=="CONVERTED_UNVERIFIED"][:8])
          PY
      - name: Independently compare full original to generated candidate
        run: |
          set -euo pipefail
          python3 scripts/audit_self_assertion_parity.py \
            --source-root external/source/SCAP_1.4/OVAL_Test_Content \
            --pack generated/self-assertion-current-candidate \
            --expected-xml 144 \
            --expected-definitions 168 \
            --expected-tests 803 \
            --output generated/full-source-parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("generated/self-assertion-current-candidate/manifest.json").read_text())
          a=json.loads(Path("generated/full-source-parity.json").read_text())
          assert m["summary"]["definitions"] == 168,m["summary"]
          assert m["summary"]["tests"] == 803,m["summary"]
          assert a["coverage"]["original"]["definitions"] == 168,a["coverage"]["original"]
          assert a["coverage"]["original"]["tests"] == 803,a["coverage"]["original"]
          assert a["source_accounted"], a["problems"][:10]
          print("Source completeness and disposition ledger: PASS")
          print("Generated:",json.dumps(m["summary"],sort_keys=True))
          print("Structural parity:",json.dumps({
            "complete":a["complete"],
            "converted":a["coverage"]["pack"]["converted_definitions"],
            "problems":len(a["problems"]),
          }))
          if a["problems"]:
            from collections import Counter
            print("PARITY ISSUE TYPES:",dict(Counter(x["type"] for x in a["problems"])))
            for problem in a["problems"][:12]:
              print("PARITY WITNESS:",json.dumps(problem,sort_keys=True)[:650])
          if not a["complete"]:
            raise SystemExit("FAIL: 0.4 full-source native conversion incomplete; candidate artifacts retained for diagnosis.")
          PY
      - name: Upload unpromoted candidate and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-oval-test-content-v04-candidate-NOT-RELEASED
          path: generated/
          if-no-files-found: warn
          retention-days: 7
