assessment:
  id: rhel-9-must-mount-var-log-audit-with-the-nodev-option-60347e4e-assessment
  version: 1
  assessment_title: RHEL 9 must mount /var/log/audit with the nodev option.
  mode: automated
  class: compliance
  purpose: assessment
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  shared_objects:
    textfilecontent54-filepath-equals-etc-fstab-pattern-pattern-match-s-s-35899b7e-object:
      capability: independent.textfilecontent54
      full_path: {equals: /etc/fstab}
      pattern: {matches_regex: '^\s*[^#\s]+\s+/var/log/audit\s+\S+\s+(\S+)\s+\S+\s+\S+\s*$'}
      instance: {equals: 1, datatype: integer}
      ignore_case: false
      multiline: true
      singleline: false
      item_creation: all_object_elements_fullfilled
      filesystem: all
      object_title: 'Textfilecontent54: filepath equals ''/etc/fstab''; pattern pattern match ''^\\s*[^#\\s]+\\s+/var/log/audit\\s+\\S+\\s+(\\S+)\\s+\\S+\\s+\\S+\\s*$''; instance equals ''1'''
  variables:
    mount-options-for-var-log-audit-in-etc-fstab-47eeba2e-variable:
      kind: local
      datatype: string
      expression:
        function:
          name: split
          arguments:
          - values:
              object: textfilecontent54-filepath-equals-etc-fstab-pattern-pattern-match-s-s-35899b7e-object
              field: subexpression
          options:
            delimiter: ','
  tests:
    var-log-audit-is-mounted-with-the-nodev-option-aa9ca01b-test:
      test_title: /var/log/audit is mounted with the nodev option
      capability: linux.partition
      object:
        mount_point: {equals: /var/log/audit}
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          mount_options: {equals: nodev, values_found: one_or_more, values_matching: one_or_more}
      reported_elements: all
    var-log-audit-is-configured-with-the-nodev-option-in-etc-fstab-7a839a29-test:
      test_title: /var/log/audit is configured with the nodev option in /etc/fstab
      capability: variable.value
      require:
        items_found: one_or_more
        items_satisfying: every
        fields:
          value: {equals: nodev, values_found: one_or_more, values_matching: one_or_more}
      reported_elements: all
      variable: mount-options-for-var-log-audit-in-etc-fstab-47eeba2e-variable
    var-log-audit-is-configured-in-etc-fstab-4b1adab6-test:
      test_title: /var/log/audit is configured in /etc/fstab
      capability: independent.textfilecontent54
      object: textfilecontent54-filepath-equals-etc-fstab-pattern-pattern-match-s-s-35899b7e-object
      require:
        items_found: one_or_more
      reported_elements: all
  evaluate:
    and:
    - test: var-log-audit-is-mounted-with-the-nodev-option-aa9ca01b-test
    - test: var-log-audit-is-configured-with-the-nodev-option-in-etc-fstab-7a839a29-test
    - test: var-log-audit-is-configured-in-etc-fstab-4b1adab6-test
