assessment:
  version: 1
  assessment_title: RHEL 9 systems using Domain Name Servers (DNS) resolution must
    have at least two name servers configured.
  mode: automated
  class: compliance
  specification:
    id: scap-ng.pre-alpha.assessment
    version: 0.4.0
  id: rhel9-shellcommand-audit-06-assessment
  tests:
    uses-dns-test:
      test_title: The system is using DNS
      capability: independent.textfilecontent54
      object:
        full_path:
          equals: /etc/nsswitch.conf
        pattern:
          matches_regex: ^\s*hosts:\s*(.*)$
        instance:
          greater_than_or_equal: 1
          datatype: integer
        ignore_case: false
        multiline: true
        singleline: false
        item_creation: all_object_elements_fullfilled
        filesystem: all
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          subexpression:
            matches_regex: (^|\s)dns(\s|$)
            values_found: one_or_more
            values_matching: every
      reported_elements: all
    bounded-evidence-test:
      test_title: 'Audit sketch: bounded evidence collection, equivalence NOT established'
      capability: independent.shellcommand
      object:
        shell: bash
        command: set -o pipefail; LC_ALL=C /usr/bin/grep '^nameserver' /etc/resolv.conf
          | LC_ALL=C /usr/bin/sort -u | /usr/bin/wc -l
        error_if_exit_status_not_0: true
        error_if_stderr_exists: true
      require:
        item_requirement:
          items_found: one_or_more
          items_satisfying: every
        field_requirement:
          values_found: one_or_more
          values_matching: every
        fields:
          exit_status:
            values_found: one_or_more
            values_matching: every
            equals: 0
            datatype: integer
          stdout_line:
            values_found: one_or_more
            values_matching: every
            greater_than_or_equal: 2
            datatype: integer
      reported_elements: all
  evaluate:
    or:
    - not:
        test: uses-dns-test
    - and:
      - test: uses-dns-test
      - test: bounded-evidence-test
